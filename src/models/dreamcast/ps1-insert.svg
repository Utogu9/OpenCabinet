<svg xmlns="http://www.w3.org/2000/svg" width="120" height="1200" viewBox="0 0 120 1200">
  <!-- Original OpenCabinet black molded grille for the PlayStation jewel case. -->
  <defs>
    <linearGradient id="ridge">
      <stop stop-color="#08090a"/>
      <stop offset=".28" stop-color="#282a2d"/>
      <stop offset=".48" stop-color="#35373a"/>
      <stop offset=".65" stop-color="#17191b"/>
      <stop offset="1" stop-color="#090a0b"/>
    </linearGradient>
    <pattern id="grille" width="10" height="1200" patternUnits="userSpaceOnUse">
      <rect width="10" height="1200" fill="url(#ridge)"/>
    </pattern>
  </defs>
  <rect width="120" height="1200" fill="url(#grille)"/>
</svg>

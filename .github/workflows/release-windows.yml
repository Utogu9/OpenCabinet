name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'

    steps:
      - name: Validate the requested tag
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$') {
            throw 'Use a version tag such as v0.1.0 or v0.1.0-beta.1.'
          }

      - name: Check out the tagged source
        uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Verify application versions
        id: version
        run: node scripts/release-windows.cjs verify

      - name: Verify signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Configure the TAURI_SIGNING_PRIVATE_KEY repository secret before publishing updates.'
          }

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies and prepare local assets
        run: npm ci

      - name: Generate application icons
        run: npm run prepare:icons

      - name: Run frontend tests
        run: npm test

      - name: Run native tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked --target x86_64-pc-windows-msvc

      - name: Build the Windows executable and NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build -- --ci --target x86_64-pc-windows-msvc --bundles nsis -- --locked

      - name: Prepare release files
        run: |
          node scripts/release-windows.cjs stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -LiteralPath target/release-portable/OpenCabinet -DestinationPath "target/release-assets/OpenCabinet_$($env:RELEASE_TAG)_windows_x64_portable.zip" -CompressionLevel Optimal
          node scripts/release-windows.cjs checksums

      - name: Keep a copy of the build artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: OpenCabinet-${{ env.RELEASE_TAG }}-windows-x64
          path: target/release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload all assets and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          $existingDraft = & gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft 2>$null
          $exists = $LASTEXITCODE -eq 0
          if ($exists -and "$existingDraft".Trim() -ne 'true') {
            throw 'This release is already published. Create a new version instead of replacing its assets.'
          }
          if (-not $exists) {
            $createArgs = @('release', 'create', $env:RELEASE_TAG, '--repo', $env:GITHUB_REPOSITORY, '--verify-tag', '--draft', '--title', "OpenCabinet $($env:RELEASE_TAG)", '--notes-file', '.github/release-notes.md')
            if ($env:IS_PRERELEASE -eq 'true') { $createArgs += '--prerelease' }
            & gh @createArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $assets = @(Get-ChildItem -LiteralPath target/release-assets -File | ForEach-Object { $_.FullName })
          $uploadArgs = @('release', 'upload', $env:RELEASE_TAG, '--repo', $env:GITHUB_REPOSITORY, '--clobber') + $assets
          & gh @uploadArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $latest = if ($env:IS_PRERELEASE -eq 'true') { 'false' } else { 'true' }
          & gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false "--latest=$latest"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Published release: https://github.com/$($env:GITHUB_REPOSITORY)/releases/tag/$($env:RELEASE_TAG)" >> $env:GITHUB_STEP_SUMMARY

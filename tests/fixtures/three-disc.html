<!doctype html><meta charset="utf-8"><title>Removable optical media</title>
<link rel="stylesheet" href="/src/styles.css">
<style>body{margin:0;background:#191d26}#stage{width:800px;height:650px}</style>
<div id="stage" class="game-box-stage" tabindex="0"></div>
<script>globalThis.OpenCabinetI18n={t:(key,...args)=>key};globalThis.OpenCabinetLocalModels={switch:true};</script>
<script src="/src/image-fallbacks.js"></script><script src="/src/dvd-case.js"></script>
<script src="/src/three-box-router.js"></script><script src="/src/game-box.js"></script>
<script type="module">
const canvas=document.createElement('canvas');canvas.width=canvas.height=256;
const ctx=canvas.getContext('2d');ctx.fillStyle='#b02830';ctx.fillRect(0,0,256,256);ctx.fillStyle='#f5d229';ctx.fillRect(0,0,128,256);
window.art=[{kind:'disc',path:canvas.toDataURL()},{kind:'cover',path:canvas.toDataURL()},{kind:'inlay',path:canvas.toDataURL()}];
window.platform=new URLSearchParams(location.search).get('platform')||'Sony PlayStation 2';
window.viewer=OpenCabinet3D.createViewer(document.getElementById('stage'),{debug:state=>window.debug=state});
window.select=(id=1,finish=null)=>viewer.update({id,title:'Disc example',platform,rom_path:'Game (USA).iso',box_3d:finish?{base:{disc_finish:finish}}:null},art);
window.parts=()=>debug.meshes.filter(mesh=>debug.materials instanceof Map?['UMD Label','Disc Silver','UMD Housing','UMD Window','UMD Disc'].includes(mesh.material?.name):mesh.material===debug.materials.disc||mesh.material===debug.materials.discSilver);
window.settle=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
select();
</script>
